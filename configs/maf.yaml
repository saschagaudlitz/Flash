model_params:
  name: MAF
  n_dim: 6
  n_latent_dim: 7
  n_layers: 10
  n_hidden_features: 32
  n_blocks: 5
  dropout_probability: 0.0
  use_batch_norm: true
  use_residual_blocks: true
  use_random_permutations: false
  use_random_masks: false
  weights: LearnableWeights
  trend_factor: 1.2
  weights_kwargs:
    n_hidden_units: 100

experiment_params:
  learning_rate: 0.0001
  manual_seed: 1337

data_params:
  batch_size: 32
  val_split_size: 0.1
  test_split_size: 0.25
  train_val_shuffle: false

trainer_params:
  max_epochs: 50
