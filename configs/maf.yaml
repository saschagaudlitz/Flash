model_params:
  name: MAF
  n_dim: 6
  n_latent_dim: 6
  n_layers: 10
  n_hidden_features: 32
  n_blocks: 5
  dropout_probability: 0.0
  use_batch_norm: true
  weights: LearnableWeights
  weights_kwargs:
    n_hidden_units: 100

experiment_params:
  learning_rate: 0.0001
  manual_seed: 1338

data_params:
  batch_size: 32
  val_split_size: 0.25
  train_val_shuffle: false

trainer_params:
  max_epochs: 100
